<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Студия — Kadro</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141414'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff4a2e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: studio app — top bar with balance, three tabs (characters, new video, my videos), sticky merge bar. */
:root {
  --paper: #f3f1ec; --card: #ffffff; --ink: #151413; --muted: #625d56; --line: #dcd6cc; --soft: #e9e5dd;
  --rec: #e5402a; --rec-ink: #ffffff; --ok: #1f7a4d; --warn: #9a6400;
  --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #0f0f10; --card: #18181a; --ink: #f1eee8; --muted: #a39e96; --line: #2b2a2d; --soft: #212024; --rec: #ff5a3c; --rec-ink: #0f0f10; --ok: #5fd39a; --warn: #f0c150; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #0f0f10; --card: #18181a; --ink: #f1eee8; --muted: #a39e96; --line: #2b2a2d; --soft: #212024; --rec: #ff5a3c; --rec-ink: #0f0f10; --ok: #5fd39a; --warn: #f0c150; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; padding-bottom: 90px; }
[hidden] { display: none !important; }
img, video, audio { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--rec); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 16px; }
.mono { font-family: var(--f-mono); font-size: 13px; }
.muted { color: var(--muted); }
h2 { font: 700 22px/1.2 var(--f-display); letter-spacing: -.01em; margin: 0 0 6px; }
h3 { font: 700 16px/1.3 var(--f-display); margin: 0; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 14px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 700 18px/1 var(--f-display); }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: var(--ink); position: relative; flex: none; }
.logo i::after { content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--rec); left: 8.5px; top: 8.5px; }
.right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bal { font: 500 14px var(--f-mono); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; background: var(--card); }
.bal b { color: var(--rec); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; padding: 10px 18px; font: 700 14.5px var(--f-body); text-decoration: none; background: var(--ink); color: var(--paper); border: 0; cursor: pointer; white-space: nowrap; }
.btn.rec { background: var(--rec); color: var(--rec-ink); }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.danger { background: none; color: var(--rec); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.lang { border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 999px; padding: 7px 11px; font: 500 13px var(--f-mono); cursor: pointer; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 14px; font: 700 15px var(--f-body); color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--rec); }
.tabs .cnt { font: 500 12px var(--f-mono); color: var(--muted); margin-left: 4px; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.form { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
label.f, div.f { display: grid; gap: 5px; font-size: 13.5px; font-weight: 700; }
label.f small, div.f small { font-weight: 500; color: var(--muted); }
input[type=text], input[type=number], textarea, select { width: 100%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: 15px var(--f-body); }
textarea { resize: vertical; min-height: 84px; }
input[type=range] { width: 100%; accent-color: var(--rec); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--paper); }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font: 700 14px var(--f-body); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.price { font: 500 14px var(--f-mono); }
.price b { color: var(--rec); font-size: 16px; }
.hint { font-size: 13.5px; color: var(--muted); }
.ideas { display: flex; gap: 6px; flex-wrap: wrap; }
.ideas button { border: 1px dashed var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; }

/* characters */
.chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.ch { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.ch .pic { aspect-ratio: 3 / 4; background: var(--soft); position: relative; }
.ch .pic img { width: 100%; height: 100%; object-fit: cover; }
.ch .body { padding: 12px 14px 14px; display: grid; gap: 8px; align-content: start; }
.ch .meta { font: 500 12px var(--f-mono); color: var(--muted); }
.ch .refs { display: flex; gap: 6px; }
.ch .refs img { width: 44px; height: 58px; object-fit: cover; border-radius: 6px; cursor: zoom-in; }
.ch .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.newch { border: 2px dashed var(--line); border-radius: 18px; display: grid; place-items: center; min-height: 260px; background: none; color: var(--muted); font: 700 16px var(--f-body); cursor: pointer; }
.newch span { display: grid; gap: 6px; justify-items: center; }
.newch b { font-size: 34px; line-height: 1; color: var(--rec); }
.wait { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; font-size: 14px; color: var(--muted); }
.spin { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--rec); border-radius: 50%; animation: sp 1s linear infinite; margin: 0 auto 8px; }
@keyframes sp { to { transform: rotate(360deg); } }
.picker { grid-column: 1 / -1; }
.cands { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
.cands button { border: 2px solid transparent; padding: 0; border-radius: 12px; overflow: hidden; cursor: pointer; background: var(--soft); aspect-ratio: 3 / 4; }
.cands button[aria-pressed="true"] { border-color: var(--rec); }
.cands img { width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 640px) { .cands { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.voicebox { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
audio { width: 100%; height: 34px; }

/* composer */
.who { display: flex; gap: 8px; flex-wrap: wrap; }
.who button { display: flex; gap: 8px; align-items: center; border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 5px 10px 5px 5px; cursor: pointer; color: var(--ink); font: 700 14px var(--f-body); }
.who button img { width: 34px; height: 44px; border-radius: 7px; object-fit: cover; }
.who button[aria-pressed="true"] { border-color: var(--rec); }
.lines { display: grid; gap: 8px; }
.line { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
@media (max-width: 640px) { .line { grid-template-columns: 1fr; } }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }

/* videos */
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.vd { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; position: relative; }
.vd .media { background: #000; aspect-ratio: 9 / 16; position: relative; }
.vd.w .media { aspect-ratio: 16 / 9; }
.vd.s .media { aspect-ratio: 1; }
.vd video, .vd .media img { width: 100%; height: 100%; object-fit: contain; }
.vd .media .wait { color: #ddd; background: rgba(0,0,0,.45); }
.vd .body { padding: 10px 12px 12px; display: grid; gap: 6px; align-content: start; }
.vd .tag { font: 500 11.5px var(--f-mono); color: var(--muted); }
.vd .txt { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.vd .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.vd .sel { position: absolute; top: 8px; left: 8px; z-index: 2; background: rgba(0,0,0,.6); color: #fff; border-radius: 8px; padding: 4px 8px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.vd.picked { outline: 3px solid var(--rec); }
.fail { color: var(--rec); font-size: 13.5px; }

.mergebar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 8px 8px 8px 18px; display: flex; gap: 12px; align-items: center; box-shadow: 0 14px 40px -12px rgba(0,0,0,.5); z-index: 20; max-width: calc(100% - 24px); }

/* gate + modal + toast */
.gate { max-width: 560px; margin: 40px auto; display: grid; gap: 18px; }
.codebox { display: flex; gap: 8px; }
.codebox input { font: 500 16px var(--f-mono); text-transform: uppercase; }
.packs { display: grid; gap: 10px; }
.pk { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card); }
.pk.pop { border-color: var(--rec); }
.pk b { font: 700 16px var(--f-display); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal .panel { width: min(520px, 100%); max-height: 90vh; overflow: auto; display: grid; gap: 14px; }
.modal img.big { max-height: 80vh; border-radius: 12px; margin: auto; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; z-index: 60; font-size: 14.5px; max-width: calc(100% - 24px); }
.toast.bad { background: var(--rec); color: var(--rec-ink); }
.keynote { background: var(--soft); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; margin-bottom: 18px; }
.keynote code { font: 700 20px var(--f-mono); letter-spacing: .04em; }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
@media (max-width: 640px) { .chars { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .newch { min-height: 0; grid-column: 1 / -1; padding: 14px; } .newch span { display: flex; align-items: center; gap: 10px; } .newch b { font-size: 26px; } .ch .refs img { width: 34px; height: 45px; } .bal, .lang { padding: 6px 10px; } #codeBtn { display: none; } .vids { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.presets-h { display: grid; gap: 2px; margin-top: 4px; }
.presets { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(175px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
.preset { scroll-snap-align: start; text-align: left; display: grid; gap: 4px; align-content: start; border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 12px; cursor: pointer; color: var(--ink); font: inherit; min-height: 150px; }
.preset:hover { border-color: var(--muted); }
.preset[aria-pressed="true"] { border-color: var(--rec); background: var(--card); }
.preset .pi { font-size: 26px; line-height: 1.1; }
.preset b { font-size: 15px; }
.preset .pt { font: 500 11px var(--f-mono); color: var(--rec); text-transform: uppercase; letter-spacing: .03em; }
.preset i { font-size: 13px; color: var(--muted); line-height: 1.35; }
.preset.rnd { border-style: dashed; }
.ch .catch { font-style: italic; font-size: 14px; line-height: 1.35; }
.ch .quirk { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="logo" href="/"><i></i><span id="brand">Kadro</span></a>
    <div class="right">
      <span class="bal" id="bal" hidden role="button" tabindex="0" style="cursor:pointer"><span data-t="bal"></span> <b id="balN">0</b></span>
      <button class="btn rec sm" id="topBuy" data-t="buy" hidden></button>
      <button class="btn ghost sm" id="codeBtn" hidden></button>
      <button class="lang" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <!-- вход -->
  <section class="gate" id="gate" hidden>
    <div>
      <h2 data-t="gate.title"></h2>
      <p class="muted" data-t="gate.text"></p>
    </div>
    <div class="panel form">
      <label class="f"><span data-t="gate.code"></span>
        <div class="codebox"><input type="text" id="codeIn" placeholder="KD-XXXX-XXXX" autocomplete="off"><button class="btn" id="codeGo" data-t="gate.enter"></button></div>
      </label>
      <div class="fail" id="codeErr" hidden></div>
    </div>
    <div>
      <h3 style="margin-bottom:10px" data-t="gate.buy"></h3>
      <div class="packs" id="gatePacks"></div>
    </div>
  </section>

  <!-- студия -->
  <main id="studio" hidden>
    <div class="keynote" id="keynote" hidden>
      <span data-t="key.saved"></span>
      <code id="keyShow"></code>
      <span class="hint" data-t="key.hint"></span>
      <div><button class="btn sm ghost" id="keyCopy" data-t="key.copy"></button> <button class="btn sm" id="keyOk" data-t="key.ok"></button></div>
    </div>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="chars" aria-selected="true"><span data-t="tab.chars"></span><span class="cnt" id="cntChars"></span></button>
      <button role="tab" data-tab="new" aria-selected="false"><span data-t="tab.new"></span></button>
      <button role="tab" data-tab="videos" aria-selected="false"><span data-t="tab.videos"></span><span class="cnt" id="cntVideos"></span></button>
    </nav>

    <!-- персонажи -->
    <section data-pane="chars">
      <div class="panel form" id="wizard" hidden style="margin-bottom:16px">
        <div class="foot" style="padding:0"><h2 data-t="w.title"></h2><button class="btn ghost sm" id="wClose" data-t="cancel"></button></div>
        <p class="hint" style="margin:0" data-t="w.rule"></p>
        <div class="presets-h"><b data-t="pr.title"></b><span class="hint" data-t="pr.hint"></span></div>
        <div class="presets" id="presets"></div>
        <div class="row">
          <label class="f"><span data-t="w.name"></span><input type="text" id="wName" maxlength="40"></label>
          <div class="f"><span data-t="w.gender"></span><div class="seg" id="wGender"><button type="button" data-v="female" aria-pressed="true" data-t="w.female"></button><button type="button" data-v="male" aria-pressed="false" data-t="w.male"></button></div></div>
          <label class="f"><span data-t="w.age"></span><input type="number" id="wAge" min="18" max="80" value="28"></label>
        </div>
        <label class="f"><span data-t="w.look"></span><small data-t="w.lookHint"></small><textarea id="wLook" maxlength="500"></textarea></label>
        <div class="ideas" id="wIdeas"></div>
        <label class="f"><span data-t="w.outfit"></span><input type="text" id="wOutfit" maxlength="300"></label>
        <div class="row" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
          <label class="f"><span data-t="w.quirk"></span><small data-t="w.quirkHint"></small><input type="text" id="wQuirk" maxlength="200"></label>
          <label class="f"><span data-t="w.catch"></span><small data-t="w.catchHint"></small><input type="text" id="wCatch" maxlength="120"></label>
        </div>
        <div class="row">
          <label class="f"><span data-t="w.voice"></span><select id="wVoice"></select></label>
          <label class="f"><span><span data-t="w.speed"></span> <span class="mono" id="wSpeedV">1.0</span></span><input type="range" id="wSpeed" min="0.7" max="1.4" step="0.05" value="1"></label>
          <label class="f"><span><span data-t="w.pitch"></span> <span class="mono" id="wPitchV">0</span></span><input type="range" id="wPitch" min="-6" max="6" step="1" value="0"></label>
          <label class="f"><span data-t="w.sample"></span><select id="wLang"></select></label>
        </div>
        <div class="foot"><span class="price"><span data-t="price"></span> <b id="wPrice"></b></span><button class="btn rec" id="wGo" data-t="w.go"></button></div>
      </div>
      <div class="chars" id="charList"></div>
    </section>

    <!-- новое видео -->
    <section data-pane="new" hidden>
      <div class="panel form" id="composer">
        <div class="seg" id="mode"><button type="button" data-v="talk" aria-pressed="true" data-t="m.talk"></button><button type="button" data-v="scene" aria-pressed="false" data-t="m.scene"></button></div>
        <p class="hint" style="margin:0" id="modeHint"></p>
        <div class="f"><span id="whoLabel"></span><div class="who" id="who"></div></div>

        <div id="talkBox" class="form">
          <label class="f"><span data-t="t.text"></span><small id="tCount"></small><textarea id="tText" maxlength="800"></textarea></label>
          <div class="ideas" id="tIdeas"></div>
          <label class="f"><span data-t="t.scene"></span><small data-t="t.sceneHint"></small><input type="text" id="tScene" maxlength="400"></label>
          <div class="row">
            <label class="f"><span data-t="lang"></span><select id="tLang"></select></label>
            <label class="f"><span data-t="t.emotion"></span><select id="tEmo"></select></label>
            <label class="f"><span data-t="aspect"></span><select id="tAspect"></select></label>
          </div>
        </div>

        <div id="sceneBox" class="form" hidden>
          <label class="f"><span data-t="s.scene"></span><small data-t="s.sceneHint"></small><textarea id="sScene" maxlength="600"></textarea></label>
          <div class="f" style="display:grid;gap:6px"><b style="font-size:13.5px" data-t="s.lines"></b><div class="lines" id="sLines"></div><div><button type="button" class="btn ghost sm" id="sAdd" data-t="s.add"></button></div></div>
          <div class="row">
            <label class="f"><span data-t="lang"></span><select id="sLang"></select></label>
            <label class="f"><span data-t="s.model"></span><select id="sModel"></select></label>
            <label class="f"><span data-t="s.duration"></span><select id="sDur"></select></label>
            <label class="f"><span data-t="aspect"></span><select id="sAspect"></select></label>
          </div>
        </div>

        <label class="f"><span data-t="from"></span><small data-t="fromHint"></small><select id="from"></select></label>
        <div class="foot"><span class="price"><span data-t="price"></span> <b id="vPrice"></b> <span class="hint" id="vPriceNote"></span></span><button class="btn rec" id="vGo" data-t="v.go"></button></div>
      </div>
      <div class="empty" id="noChars" hidden><p data-t="noChars"></p><button class="btn rec" id="noCharsGo" data-t="w.title"></button></div>
    </section>

    <!-- мои видео -->
    <section data-pane="videos" hidden>
      <div class="vids" id="vidList"></div>
    </section>
  </main>
</div>

<div class="mergebar" id="mergeBar" hidden><span id="mergeTxt"></span><button class="btn rec sm" id="mergeGo"></button><button class="btn sm ghost" style="color:inherit;border-color:#555" id="mergeX" data-t="cancel"></button></div>

<div class="modal" id="buyModal" hidden><div class="panel"><div class="foot" style="padding:0"><h2 data-t="buyTitle"></h2><button class="btn ghost sm" data-close data-t="close"></button></div><div class="packs" id="modalPacks"></div><div class="fail" id="buyErr" hidden></div></div></div>
<div class="modal" id="codeModal" hidden><div class="panel"><div class="foot" style="padding:0"><h2 data-t="code.title"></h2><button class="btn ghost sm" data-close data-t="close"></button></div><p class="hint" style="margin:0" data-t="key.hint"></p><code class="mono" style="font-size:20px" id="codeFull"></code><div class="foot"><button class="btn ghost sm" id="codeCopy" data-t="key.copy"></button><button class="btn danger sm" id="logout" data-t="code.out"></button></div></div></div>
<div class="modal" id="imgModal" hidden><img class="big" id="imgBig" alt=""></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const T = {

    $("mergeBar").hidden = mergeSel.size < 2 || tab !== "videos";
    $("mergeTxt").textContent = t("merge", { n: mergeSel.size });
    $("mergeGo").textContent = t("mergeGo", { p: cfg?.catalog.prices.merge ?? 1 });
  }

  // ---------- покупка ----------
  function renderPacks() {
    const html = cfg.packs.map(p => `<div class="pk${p.popular ? " pop" : ""}"><div><b>${esc(p.name[L] || p.name.ru)}</b><div class="mono muted">${p.credits} ${esc(t("cr"))}</div></div><button class="btn${p.popular ? " rec" : ""} sm" data-pack="${esc(p.id)}" ${cfg.stripe ? "" : "disabled"}>${esc(money(p.price))}</button></div>`).join("") + (cfg.stripe ? "" : `<p class="hint">${esc(t("soon"))}</p>`);
    $("gatePacks").innerHTML = html; $("modalPacks").innerHTML = html;
  }
  const money = (n) => new Intl.NumberFormat(L === "en" ? "en-US" : "ru-RU", { style: "currency", currency: (cfg.currency || "eur").toUpperCase(), maximumFractionDigits: n % 1 ? 2 : 0 }).format(n);
  function openBuy() { if (cfg) { renderPacks(); $("buyErr").hidden = true; $("buyModal").hidden = false; } }
  async function buy(id, errEl) {
    try {
      const r = await fetch("/api/checkout", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ pack: id, key: KEY, lang: L }) });
      const d = await r.json();
      if (!r.ok || !d.url) throw new Error(d.error);
      location.href = d.url;
    } catch (e) { if (errEl) { errEl.textContent = e.message; errEl.hidden = false; } else toast(e.message, true); }
  }
  document.addEventListener("click", e => { const b = e.target.closest("[data-pack]"); if (b) { b.disabled = true; buy(b.dataset.pack, b.closest("#buyModal") ? $("buyErr") : null).finally(() => b.disabled = false); } });

  // ---------- вход и выход ----------
  function showStudio() {
    $("gate").hidden = !!KEY; $("studio").hidden = !KEY;
    $("bal").hidden = !KEY; $("topBuy").hidden = !KEY; $("codeBtn").hidden = !KEY;
    $("codeBtn").textContent = KEY ? KEY.slice(0, 7) + "…" : "";
    if (KEY) refresh();
  }
  function logout() { KEY = ""; store.del("kd-key"); st = { credits: 0, chars: [], videos: [] }; $("codeModal").hidden = true; showStudio(); }
  async function login(code) {
    $("codeErr").hidden = true;
    const k = code.trim().toUpperCase();
    const r = await fetch("/api/balance", { headers: { "x-key": k } });
    if (!r.ok) { $("codeErr").textContent = t("gate.bad"); $("codeErr").hidden = false; return; }
    KEY = k; store.set("kd-key", k); showStudio();
  }
  $("codeGo").addEventListener("click", () => login($("codeIn").value));
  $("codeIn").addEventListener("keydown", e => { if (e.key === "Enter") login($("codeIn").value); });
  const showCode = () => { $("codeFull").textContent = KEY; $("codeModal").hidden = false; };
  $("codeBtn").addEventListener("click", showCode); $("bal").addEventListener("click", showCode);
  $("logout").addEventListener("click", logout);
  const copy = (s) => navigator.clipboard?.writeText(s).then(() => toast(t("copied"))).catch(() => {});
  $("codeCopy").addEventListener("click", () => copy(KEY));
  $("keyCopy").addEventListener("click", () => copy(KEY));
  $("keyOk").addEventListener("click", () => $("keynote").hidden = true);
  $("topBuy").addEventListener("click", openBuy);
  document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) m.hidden = true; }));
  document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".modal").forEach(m => m.hidden = true); });

  // ---------- вкладки ----------
  function setTab(n) {
    tab = n;
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === n));
    document.querySelectorAll("[data-pane]").forEach(p => p.hidden = p.dataset.pane !== n);
    mergeUi();
  }
  document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

  // ---------- мастер персонажа ----------
  const openWizard = () => { $("wizard").hidden = false; setTab("chars"); $("wName").focus(); };
  $("noCharsGo").addEventListener("click", openWizard);
  $("wClose").addEventListener("click", () => $("wizard").hidden = true);
  $("wGender").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; wGender = b.dataset.v; $("wGender").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); $("wVoice").value = ""; fillSelects(); });
  $("wSpeed").addEventListener("input", () => $("wSpeedV").textContent = (+$("wSpeed").value).toFixed(2));
  $("wPitch").addEventListener("input", () => $("wPitchV").textContent = $("wPitch").value);
  let wPreset = "";
  function renderPresets() {
    $("presets").innerHTML = PRESETS.map(p => `<button type="button" class="preset" data-p="${p.id}" aria-pressed="${wPreset === p.id}"><span class="pi">${p.icon}</span><b>${esc(p.name)}</b><span class="pt">${esc(p.tag)}</span><i>«${esc(p.catch)}»</i></button>`).join("")
      + `<button type="button" class="preset rnd" data-p="random"><span class="pi">🎲</span><b>${esc(t("pr.rnd"))}</b><span class="pt">${esc(t("pr.rndT"))}</span><i>${esc(t("pr.rndI"))}</i></button>`;
  }
  function applyPreset(p) {
    wPreset = p.id;
    $("wName").value = p.name; $("wAge").value = p.age; $("wLook").value = p.look; $("wOutfit").value = p.outfit; $("wQuirk").value = p.quirk; $("wCatch").value = p.catch;
    wGender = p.gender; $("wGender").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === p.gender));
    if (cfg) fillSelects();
    $("wVoice").value = p.voice;
    $("wSpeed").value = p.speed; $("wSpeedV").textContent = (+p.speed).toFixed(2); $("wPitch").value = p.pitch; $("wPitchV").textContent = p.pitch;
    renderPresets();
  }
  $("presets").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (!b) return; applyPreset(b.dataset.p === "random" ? randomPreset() : PRESETS.find(p => p.id === b.dataset.p)); });
  $("wIdeas").addEventListener("click", e => { const b = e.target.closest("button"); if (b) $("wLook").value = t("ideas")[+b.dataset.i]; });
  $("wGo").addEventListener("click", async () => {
    const b = $("wGo"); b.disabled = true;
    try {
      await api("/api/chars", { preset: wPreset, quirk: $("wQuirk").value, catch: $("wCatch").value, name: $("wName").value, gender: wGender, age: $("wAge").value, look: $("wLook").value, outfit: $("wOutfit").value, voice: $("wVoice").value, speed: $("wSpeed").value, pitch: $("wPitch").value, lang: $("wLang").value });
      $("wizard").hidden = true; ["wName", "wLook", "wOutfit", "wQuirk", "wCatch"].forEach(id => $(id).value = ""); wPreset = ""; renderPresets();
      toast(t("charStarted")); await refresh();
    } catch (e) { toast(e.message, true); }
    b.disabled = false;
  });

  // ---------- действия с персонажами ----------
  $("charList").addEventListener("click", async e => {
    if (e.target.closest("#newCh")) return openWizard();
    const z = e.target.closest("[data-zoom]"); if (z) { $("imgBig").src = z.dataset.zoom; $("imgModal").hidden = false; return; }
    const card = e.target.closest("[data-id]"); if (!card) return;
    const id = card.dataset.id, c = st.chars.find(x => x.id === id);
    const cand = e.target.closest("[data-cand]");
    if (cand) { candPick[id] = +cand.dataset.cand; card.querySelectorAll("[data-cand]").forEach(x => x.setAttribute("aria-pressed", x === cand)); card.querySelector('[data-act="pick"]').disabled = false; return; }
    const a = e.target.closest("[data-act]")?.dataset.act; if (!a) return;
    const btn = e.target.closest("button"); if (btn) btn.disabled = true;
    try {
      if (a === "pick") await api("/api/chars/pick", { id, index: candPick[id] });
      if (a === "reroll") await api("/api/chars/reroll", { id });
      if (a === "del") { if (!confirm(t("c.delQ"))) { if (btn) btn.disabled = false; return; } await api("/api/chars/delete", { id }); }
      if (a === "rename") { const n = prompt(t("c.newName"), c.name); if (n) await api("/api/chars/rename", { id, name: n }); }
      if (a === "voice") { const q = (f) => card.querySelector(`[data-f="${f}"]`).value; await api("/api/chars/voice", { id, voice: q("voice"), lang: q("lang"), speed: q("speed"), pitch: q("pitch") }); }
      if (a === "video") { picked = [id]; mode = "talk"; $("from").value = ""; renderComposer(); setTab("new"); }
      await refresh();
    } catch (err) { toast(err.message, true); }
    if (btn) btn.disabled = false;
  });

  // ---------- композер ----------
  $("mode").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; mode = b.dataset.v; renderComposer(); });
  $("who").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const id = b.dataset.id;
    if (mode === "talk") picked = [id];
    else if (picked.includes(id)) { if (picked.length > 1) picked = picked.filter(x => x !== id); }
    else picked = [...picked, id].slice(-2);
    renderComposer();
  });
  $("tIdeas").addEventListener("click", e => {
    const c = st.chars.find(x => x.id === $("tIdeas").dataset.char); if (!c) return;
    const ta = $("tText");
    if (e.target.closest("[data-catch]")) ta.value = (ta.value.trim() ? ta.value.trim() + " " : "") + c.catch;
    const i = e.target.closest("[data-idea]"); if (i) ta.value = (PRESETS.find(p => p.id === c.preset)?.ideas || GENERIC_IDEAS)[+i.dataset.idea];
    ta.focus(); price();
  });
  $("sAdd").addEventListener("click", () => { if (lines.length < 4) { lines.push({ char: picked[lines.length % picked.length] || picked[0], text: "" }); renderLines(); } });
  $("sLines").addEventListener("input", e => { const r = e.target.closest(".line"); if (r) lines[+r.dataset.i][e.target.dataset.f] = e.target.value; });
  $("sLines").addEventListener("change", e => { const r = e.target.closest(".line"); if (r) lines[+r.dataset.i][e.target.dataset.f] = e.target.value; });
  $("sLines").addEventListener("click", e => { const x = e.target.closest('[data-f="x"]'); if (x) { lines.splice(+x.closest(".line").dataset.i, 1); x.blur(); renderLines(); } });
  $("sModel").addEventListener("change", sceneModelChanged);
  ["tText", "sDur"].forEach(id => $(id).addEventListener("input", price));
  $("vGo").addEventListener("click", async () => {
    const b = $("vGo"); b.disabled = true;
    try {
      if (mode === "talk") await api("/api/videos/talk", { char: picked[0], text: $("tText").value, scene: $("tScene").value, lang: $("tLang").value, emotion: $("tEmo").value, aspect: $("tAspect").value, from: $("from").value });
      else await api("/api/videos/scene", { chars: picked, scene: $("sScene").value, lines: lines.filter(l => l.text.trim()), lang: $("sLang").value, model: $("sModel").value, duration: $("sDur").value, aspect: $("sAspect").value, from: $("from").value });
      toast(t("started"));
      if (mode === "talk") $("tText").value = ""; else { $("sScene").value = ""; lines = []; }
      await refresh(); setTab("videos");
    } catch (e) { toast(e.message, true); }
    b.disabled = false;
  });

  // ---------- мои видео ----------
  $("vidList").addEventListener("change", e => {
    if (e.target.dataset.act !== "sel") return;
    const id = e.target.closest(".vd").dataset.id;
    if (e.target.checked) mergeSel.add(id); else mergeSel.delete(id);
    e.target.closest(".vd").classList.toggle("picked", e.target.checked);
    e.target.closest(".vd").dataset.sig = "";
    mergeUi();
  });
  $("vidList").addEventListener("click", async e => {
    const a = e.target.closest("[data-act]")?.dataset.act; if (!a || a === "sel") return;
    const id = e.target.closest(".vd").dataset.id, v = st.videos.find(x => x.id === id);
    if (a === "cont") {
      mode = v.mode === "scene" || v.chars.length > 1 ? "scene" : "talk";
      picked = v.chars.filter(cid => ready().some(c => c.id === cid)).slice(0, 2);
      renderComposer(); $("from").value = id; setTab("new"); window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (a === "vdel") { if (!confirm(t("v.delQ"))) return; try { await api("/api/videos/delete", { id }); mergeSel.delete(id); await refresh(); } catch (err) { toast(err.message, true); } }
  });
  $("mergeX").addEventListener("click", () => { mergeSel.clear(); renderVideos(); });
  $("mergeGo").addEventListener("click", async () => {
    // порядок склейки — от старых к новым
    const ids = st.videos.filter(v => mergeSel.has(v.id)).sort((a, b) => a.created - b.created).map(v => v.id);
    try { await api("/api/videos/merge", { ids }); mergeSel.clear(); toast(t("mergeOk")); await refresh(); } catch (e) { toast(e.message, true); }
  });

  $("langBtn").addEventListener("click", () => { L = L === "ru" ? "en" : "ru"; store.set("kd-lang", L); applyText(); });

  // ---------- старт ----------
  (async () => {
    applyText();
    try { cfg = await (await fetch("/api/config")).json(); } catch { return toast("Network error", true); }
    document.querySelector("#brand").textContent = cfg.brand; document.title = `${L === "en" ? "Studio" : "Студия"} — ${cfg.brand}`;
    applyText();
    // возврат после оплаты
    const sid = new URLSearchParams(location.search).get("session_id");
    if (sid) {
      history.replaceState(null, "", "/app");
      try {
        const r = await fetch(`/api/checkout/confirm?session_id=${encodeURIComponent(sid)}`); const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        const isNew = d.key !== KEY;
        KEY = d.key; store.set("kd-key", KEY);
        if (d.added) toast(t("paid", { n: d.added }));
        if (isNew) { $("keyShow").textContent = KEY; $("keynote").hidden = false; }
      } catch (e) { toast(e.message, true); }
    }
    showStudio();
  })();
})();
</script>
</body>
</html>
